---
- name: Migrate Database Data
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    local_dump_dir: "{{ playbook_dir }}/build/db_dumps"

  tasks:
    - name: Ensure local dump directory exists
      file:
        path: "{{ local_dump_dir }}"
        state: directory

    - name: Dump local acore_auth database
      command: >
        docker exec ac-database mysqldump -u root -ppassword acore_auth --result-file=/tmp/acore_auth.sql
      changed_when: false

    - name: Copy dump from container to host
      command: >
        docker cp ac-database:/tmp/acore_auth.sql {{ local_dump_dir }}/acore_auth.sql
      changed_when: false

    - name: Dump local acore_characters database
      command: >
        docker exec ac-database mysqldump -u root -ppassword acore_characters --result-file=/tmp/acore_characters.sql
      changed_when: false

    - name: Copy characters dump from container to host
      command: >
        docker cp ac-database:/tmp/acore_characters.sql {{ local_dump_dir }}/acore_characters.sql
      changed_when: false

- name: Restore Database on Remote
  hosts: remote
  gather_facts: false
  vars:
    local_dump_dir: "{{ playbook_dir }}/build/db_dumps"
    remote_dump_dir: "/tmp/db_dumps"

  tasks:
    - name: Ensure remote dump directory exists
      file:
        path: "{{ remote_dump_dir }}"
        state: directory

    - name: Copy dumps to remote host
      copy:
        src: "{{ local_dump_dir }}/"
        dest: "{{ remote_dump_dir }}/"
        mode: "0644"

    - name: Copy dumps into remote database container
      command: >
        docker cp {{ remote_dump_dir }}/{{ item }} ac-database:/tmp/{{ item }}
      loop:
        - acore_auth.sql
        - acore_characters.sql
      changed_when: false

    - name: Restore acore_auth database
      command: >
        docker exec ac-database mysql -u root -ppassword acore_auth -e "source /tmp/acore_auth.sql"
      changed_when: true

    - name: Restore acore_characters database
      command: >
        docker exec ac-database mysql -u root -ppassword acore_characters -e "source /tmp/acore_characters.sql"
      changed_when: true

    - name: Cleanup remote dumps
      file:
        path: "{{ remote_dump_dir }}"
        state: absent

    - name: Cleanup local dumps
      file:
        path: "{{ local_dump_dir }}"
        state: absent
      delegate_to: localhost
